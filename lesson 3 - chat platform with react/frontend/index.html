<!DOCTYPE html>
<html lang="en">
<!-- Define the document language as English by default, adjustable via LanguageSwitcher. -->

<head>
  <!-- Set character encoding to UTF-8 for universal text support. -->
  <meta charset="UTF-8" />
  <!-- Ensure responsive design with viewport settings for mobile and desktop compatibility. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Define the page title for browser tab and SEO. -->
  <meta name="title" content="Segraph" />

  <!-- Open Graph metadata for social media sharing (e.g., Facebook, LinkedIn). -->
  <meta property="og:title" content="Segraph" />
  <meta property="og:image" content="/images/og-image.jpg" /> <!-- Image for social media previews -->
  <meta property="og:type" content="website" /> <!-- Define content type as a website -->

  <!-- Twitter Card metadata for Twitter sharing, using a large image summary. -->
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Favicon for browser tab and bookmarks. -->
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />

  <!-- Page title displayed in the browser tab. -->
  <title>Segraph</title>
</head>

<body>
  <!-- Root element where the React application will be mounted. -->
  <div id="root"></div>

  <!-- Load the main React application bundle asynchronously with defer to improve performance. -->
  <script type="module" src="/src/main.tsx" async defer></script>
</body>

</html>
